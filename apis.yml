aid: aunt-flow
name: Aunt Flow
description: Aunt Flow is a woman-owned company on a mission to end period poverty by making menstrual
  products freely accessible in public restrooms the same way toilet paper is. It manufactures and
  sells free-vend period product dispensers (models P, E, R, and O), organic cotton tampons and pads,
  touch-free disposal systems, and retail display boxes, serving schools, universities, offices,
  airports, stadiums, ski resorts, restaurants, health systems, amusement parks, and coworking spaces.
  Since 2021 the company has donated over 6 million period products to people in need. Aunt Flow is a
  physical-products and e-commerce business (Techstars-backed) with no public developer API surface; this
  profile captures its identity, commercial links, and domain-security posture for the API Evangelist network.
